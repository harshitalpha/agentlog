<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentlog</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #13161b; --panel2: #181c22; --line: #232831;
    --text: #e6e8eb; --dim: #8b93a1; --faint: #5b6370;
    --accent: #e8a54b; --add: #3fb950; --add-bg: rgba(46,160,67,.13); --add-num: rgba(46,160,67,.22);
    --del: #f85149; --del-bg: rgba(248,81,73,.12); --del-num: rgba(248,81,73,.2);
    --hunk: #1a2230; --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .brand { font-family: var(--mono); font-weight: 700; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .repo { color: var(--dim); font-family: var(--mono); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--add); box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(63,185,80,0); } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); } }
  .spacer { flex: 1; }
  .search { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 6px 10px; width: 260px; font: 13px var(--sans); outline: none; }
  .search:focus { border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { padding: 5px 10px; font-size: 12px; color: var(--dim); }
  .seg button.on { background: var(--panel2); color: var(--text); }

  main { flex: 1; display: grid; grid-template-columns: 400px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .day { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 12px 18px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .item { position: relative; display: block; width: 100%; text-align: left; padding: 10px 16px 10px 46px; border-left: 2px solid transparent; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); border-left-color: var(--accent); }
  .item::before { content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .dot { position: absolute; left: 19px; top: 15px; width: 11px; height: 11px; border-radius: 50%; background: var(--panel); border: 2px solid var(--faint); z-index: 1; }
  .item.agent .dot { border-color: var(--accent); }
  .item.auto .dot { border-color: var(--faint); border-style: dashed; }
  .item.work .dot { border-color: var(--add); background: var(--add-bg); }
  .item.sel .dot { background: var(--accent); border-color: var(--accent); }
  .subj { font-weight: 500; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item.auto .subj { color: var(--dim); }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 12px; color: var(--faint); font-family: var(--mono); }
  .num { color: var(--faint); }
  .badge { font-family: var(--sans); font-size: 11px; padding: 0 6px; border-radius: 4px; background: rgba(232,165,75,.14); color: var(--accent); }
  .badge.auto { background: rgba(139,147,161,.14); color: var(--dim); }
  .badge.work { background: var(--add-bg); color: var(--add); }
  .stat .a { color: var(--add); } .stat .d { color: var(--del); }
  .empty { padding: 40px 24px; color: var(--dim); text-align: center; }

  section { overflow-y: auto; min-width: 0; }
  .detail { max-width: 1200px; margin: 0 auto; padding: 26px 30px 80px; }
  .d-head h1 { font-size: 21px; line-height: 1.35; margin: 0 0 8px; font-weight: 600; letter-spacing: -.01em; }
  .d-body { white-space: pre-wrap; color: var(--dim); margin: 0 0 12px; font-size: 13.5px; }
  .d-meta { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12.5px; font-family: var(--mono); padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .d-meta b { color: var(--text); font-weight: 500; }
  .copy { color: var(--accent); }
  .files { margin: 16px 0 18px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); background: var(--panel); }
  .chip:hover { color: var(--text); border-color: var(--faint); }
  .chip i { font-style: normal; margin-left: 6px; }

  .file { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 16px; overflow: hidden; background: var(--panel); }
  .f-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
  .f-head .tog { color: var(--faint); width: 14px; transition: transform .15s; }
  .file.closed .tog { transform: rotate(-90deg); }
  .file.closed table, .file.closed .bin { display: none; }
  .f-path { font: 13px var(--mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f-status { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
  .f-status.added { color: var(--add); border-color: rgba(63,185,80,.4); }
  .f-status.deleted { color: var(--del); border-color: rgba(248,81,73,.4); }
  .f-btn { font-size: 12px; color: var(--dim); padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); }
  .f-btn:hover { color: var(--text); }
  table.diff { width: 100%; border-collapse: collapse; font: 12.5px/1.55 var(--mono); table-layout: fixed; }
  .diff td { padding: 0 10px; vertical-align: top; }
  .diff td.n { width: 52px; text-align: right; color: var(--faint); user-select: none; padding: 0 8px; }
  .diff td.c { white-space: pre-wrap; word-break: break-all; }
  .diff tr.add td.c { background: var(--add-bg); } .diff tr.add td.n { background: var(--add-num); }
  .diff tr.del td.c { background: var(--del-bg); } .diff tr.del td.n { background: var(--del-num); }
  .diff tr.add td.c::before { content: "+"; color: var(--add); margin-right: 6px; }
  .diff tr.del td.c::before { content: "-"; color: var(--del); margin-right: 6px; }
  .diff tr.ctx td.c::before { content: " "; margin-right: 6px; }
  .diff tr.hunk td { background: var(--hunk); color: #7d97c4; padding: 3px 10px; }
  .bin { padding: 14px; color: var(--dim); font-size: 13px; }
  .placeholder { height: 100%; display: grid; place-items: center; color: var(--faint); }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal.on { display: flex; }
  .m-box { width: min(1100px, 92vw); height: 86vh; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .m-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font: 13px var(--mono); }
  .m-head span { flex: 1; color: var(--dim); }
  .m-body { overflow: auto; flex: 1; }
  .m-body table td.n { width: 52px; }
  .kbd { font: 11px var(--mono); color: var(--faint); }
  .kbd b { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--dim); font-weight: 400; }
</style>
</head>
<body>
<header>
  <div class="brand">agent<span>log</span></div>
  <div class="repo"><span class="live" title="live: refreshes as commits land"></span><span id="repoName">…</span><span class="pill" id="branch">…</span></div>
  <div class="spacer"></div>
  <span class="kbd"><b>j</b>/<b>k</b> move</span>
  <div class="seg" id="order">
    <button data-o="new" class="on">Newest first</button>
    <button data-o="old">Story order</button>
  </div>
  <input class="search" id="q" placeholder="Filter commits or files…" autocomplete="off">
</header>
<main>
  <aside id="list"></aside>
  <section id="detail"><div class="placeholder">Pick a commit</div></section>
</main>
<div class="modal" id="modal"><div class="m-box">
  <div class="m-head"><span id="mTitle"></span><button class="f-btn" id="mClose">Close (Esc)</button></div>
  <div class="m-body" id="mBody"></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = p => fetch(p).then(r => r.json());

let commits = [], repo = {}, selected = null, order = "new", query = "", patchCache = {};

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function dayLabel(iso) {
  const d = new Date(iso), t = new Date();
  const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}

function rows() {
  let list = commits.map((c, i) => ({ ...c, n: commits.length - i }));
  if (repo.dirty) list.unshift({ hash: "WORKING", subject: `Uncommitted changes (${repo.dirty} file${repo.dirty > 1 ? "s" : ""})`, date: new Date().toISOString(), work: true, body: "" });
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(c => (c.subject + " " + c.body + " " + c.short + " " + (c.agent || "")).toLowerCase().includes(q) || (c._files || []).some(f => f.toLowerCase().includes(q)));
  }
  if (order === "old") list.reverse();
  return list;
}

function renderList() {
  const list = rows(), el = $("#list");
  if (!list.length) { el.innerHTML = `<div class="empty">${commits.length ? "No matches." : "No commits yet.<br>Ask your agent for a change and it will show up here."}</div>`; return; }
  let html = "", lastDay = "";
  for (const c of list) {
    const day = c.work ? "Now" : dayLabel(c.date);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const cls = c.work ? "work" : c.agent === "auto" ? "auto" : c.agent ? "agent" : "";
    const badge = c.work ? `<span class="badge work">working tree</span>`
      : c.agent ? `<span class="badge ${c.agent === "auto" ? "auto" : ""}">${esc(c.agent)}</span>` : "";
    const meta = c.work ? `${badge}` :
      `<span class="num">#${c.n}</span>${badge}<span>${ago(c.date)}</span><span class="stat"><span class="a">+${c.ins}</span> <span class="d">−${c.dels}</span></span>`;
    html += `<button class="item ${cls} ${selected === c.hash ? "sel" : ""}" data-h="${c.hash}">
      <span class="dot"></span><div class="subj">${esc(c.subject)}</div><div class="meta">${meta}</div></button>`;
  }
  el.innerHTML = html;
}

function parsePatch(patch) {
  const files = []; let f = null, h = null;
  for (const line of patch.split("\n")) {
    if (line.startsWith("diff --git ")) {
      const m = line.match(/^diff --git a\/(.*) b\/(.*)$/);
      f = { path: m ? m[2] : line.slice(11), old: m ? m[1] : "", status: "modified", hunks: [], binary: false, add: 0, del: 0 };
      files.push(f); h = null; continue;
    }
    if (!f) continue;
    if (line.startsWith("new file")) f.status = "added";
    else if (line.startsWith("deleted file")) f.status = "deleted";
    else if (line.startsWith("rename from")) f.status = "renamed";
    else if (line.startsWith("Binary files")) f.binary = true;
    else if (line.startsWith("--- ") || line.startsWith("+++ ")) {
      if (line.startsWith("+++ ") && line !== "+++ /dev/null" && f.status === "modified" && f.old === "dev/null") f.status = "added";
    }
    else if (line.startsWith("@@")) {
      const m = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)/);
      h = { header: line, o: m ? +m[1] : 0, n: m ? +m[2] : 0, lines: [] }; f.hunks.push(h);
    } else if (h) {
      if (line.startsWith("+")) { h.lines.push(["add", null, h.n++, line.slice(1)]); f.add++; }
      else if (line.startsWith("-")) { h.lines.push(["del", h.o++, null, line.slice(1)]); f.del++; }
      else if (line.startsWith(" ")) h.lines.push(["ctx", h.o++, h.n++, line.slice(1)]);
    }
  }
  for (const x of files) if (x.old === "dev/null" || x.path === "dev/null") x.status = "added";
  return files;
}

function fileHtml(f, i, hash) {
  let body = "";
  if (f.binary) body = `<div class="bin">Binary file</div>`;
  else if (!f.hunks.length) body = `<div class="bin">No content changes (${f.status})</div>`;
  else {
    body = `<table class="diff">`;
    for (const h of f.hunks) {
      body += `<tr class="hunk"><td colspan="3">${esc(h.header)}</td></tr>`;
      for (const [t, o, n, txt] of h.lines)
        body += `<tr class="${t}"><td class="n">${o ?? ""}</td><td class="n">${n ?? ""}</td><td class="c">${esc(txt)}</td></tr>`;
    }
    body += `</table>`;
  }
  const big = f.add + f.del > 400;
  const canView = f.status !== "deleted" && !f.binary;
  return `<div class="file ${big ? "closed" : ""}" id="f${i}">
    <div class="f-head"><button class="tog" data-tog="${i}">▾</button>
      <span class="f-path" title="${esc(f.path)}">${esc(f.path)}</span>
      <span class="f-status ${f.status}">${f.status}</span>
      <span class="stat" style="font:12px var(--mono)"><span class="a" style="color:var(--add)">+${f.add}</span> <span style="color:var(--del)">−${f.del}</span></span>
      ${canView ? `<button class="f-btn" data-view="${esc(f.path)}" data-hash="${hash}">View file</button>` : ""}
    </div>${body}</div>`;
}

async function select(hash, scroll) {
  selected = hash; renderList();
  if (scroll) document.querySelector(`.item[data-h="${hash}"]`)?.scrollIntoView({ block: "nearest" });
  const c = hash === "WORKING" ? rows().find(r => r.work) : commits.find(x => x.hash === hash);
  if (!c) return;
  const det = $("#detail");
  det.innerHTML = `<div class="detail"><div class="placeholder" style="height:200px">Loading…</div></div>`;
  let patch = patchCache[hash];
  if (!patch || hash === "WORKING") { patch = (await api(`/api/patch?hash=${hash}`)).patch || ""; if (hash !== "WORKING") patchCache[hash] = patch; }
  if (selected !== hash) return;
  const files = parsePatch(patch);
  c._files = files.map(f => f.path);
  const n = commits.length - commits.indexOf(c);
  const meta = c.work ? `<span>Not committed yet, the agent is probably still working</span>` :
    `<span>#${n} of ${commits.length}</span>
     <span><b>${esc(c.author)}</b>${c.agent && c.agent !== c.author ? ` · ${esc(c.agent)}` : ""}</span>
     <span title="${esc(c.date)}">${new Date(c.date).toLocaleString()}</span>
     <button class="copy" data-copy="${c.hash}">${c.short} ⧉</button>`;
  const totalA = files.reduce((s, f) => s + f.add, 0), totalD = files.reduce((s, f) => s + f.del, 0);
  const cleanBody = (c.body || "").replace(/^(Co-Authored-By|Agent|Claude-Session|Signed-off-by):.*$/gim, "").trim();
  det.innerHTML = `<div class="detail">
    <div class="d-head"><h1>${esc(c.subject)}</h1>${cleanBody ? `<p class="d-body">${esc(cleanBody)}</p>` : ""}</div>
    <div class="d-meta">${meta}<span>${files.length} file${files.length !== 1 ? "s" : ""} · <span style="color:var(--add)">+${totalA}</span> <span style="color:var(--del)">−${totalD}</span></span></div>
    <div class="files">${files.map((f, i) => `<button class="chip" data-jump="${i}">${esc(f.path.split("/").pop())}<i style="color:var(--add)">+${f.add}</i><i style="color:var(--del)">−${f.del}</i></button>`).join("")}</div>
    ${files.map((f, i) => fileHtml(f, i, hash)).join("") || `<div class="bin">No file changes.</div>`}
  </div>`;
  det.scrollTop = 0;
}

async function viewFile(hash, path) {
  $("#mTitle").textContent = `${path} @ ${hash === "WORKING" ? "working tree" : hash.slice(0, 8)}`;
  $("#mBody").innerHTML = `<div class="bin">Loading…</div>`;
  $("#modal").classList.add("on");
  const { content = "" } = await api(`/api/file?hash=${hash}&path=${encodeURIComponent(path)}`);
  $("#mBody").innerHTML = `<table class="diff">${content.replace(/\n$/, "").split("\n").map((l, i) =>
    `<tr class="ctx"><td class="n">${i + 1}</td><td class="c">${esc(l)}</td></tr>`).join("")}</table>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-h],[data-tog],[data-jump],[data-view],[data-copy],[data-o]");
  if (!t) { if (e.target.id === "modal") $("#modal").classList.remove("on"); return; }
  if (t.dataset.h) select(t.dataset.h);
  else if (t.dataset.tog) $("#f" + t.dataset.tog).classList.toggle("closed");
  else if (t.dataset.jump) { const f = $("#f" + t.dataset.jump); f.classList.remove("closed"); f.scrollIntoView({ behavior: "smooth" }); }
  else if (t.dataset.view) viewFile(t.dataset.hash, t.dataset.view);
  else if (t.dataset.copy) { navigator.clipboard?.writeText(t.dataset.copy); t.textContent = "copied ✓"; }
  else if (t.dataset.o) { order = t.dataset.o; document.querySelectorAll("#order button").forEach(b => b.classList.toggle("on", b === t)); renderList(); }
});
$("#mClose").onclick = () => $("#modal").classList.remove("on");
$("#q").oninput = e => { query = e.target.value.trim(); renderList(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return $("#modal").classList.remove("on");
  if (e.target.tagName === "INPUT") return;
  if (e.key === "/") { e.preventDefault(); return $("#q").focus(); }
  if (e.key !== "j" && e.key !== "k") return;
  const list = rows(), i = list.findIndex(c => c.hash === selected);
  const next = list[Math.max(0, Math.min(list.length - 1, i + (e.key === "j" ? 1 : -1)))];
  if (next) select(next.hash, true);
});

async function refresh(first) {
  const r = await api("/api/repo").catch(() => null);
  if (!r) return;
  const changed = first || r.head !== repo.head || r.dirty !== repo.dirty;
  repo = r;
  $("#repoName").textContent = r.name; $("#branch").textContent = r.branch;
  document.title = `agentlog · ${r.name}`;
  if (!changed) return;
  commits = await api("/api/commits");
  const stillThere = selected === "WORKING" ? r.dirty : commits.some(c => c.hash === selected);
  if (first || !stillThere) { const top = rows()[order === "new" ? 0 : rows().length - 1]; top ? select(top.hash) : renderList(); }
  else { renderList(); if (selected === "WORKING") select("WORKING"); }
}
refresh(true);
setInterval(refresh, 3000);
</script>
</body>
</html>
